name: nyc_taxi

x-logging: &logging            # evita que los logs crezcan sin límite en disco
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- SIEMPRE ENCENDIDOS (consumo mínimo) ---

  dozzle:                       # logs en vivo de todos los contenedores
    image: amir20/dozzle:latest # conviene fijar una versión una vez que veas cuál funciona
    container_name: dozzle_nyc
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  shaper:
    image: taleshape/shaper:latest
    container_name: shaper_nyc
    ports:
      - "127.0.0.1:5454:5454"
    volumes:
      - ./data:/data
      - ./dashboards:/dashboards
      - shaper_state:/var/lib/shaper
    command: >     
      --dir /var/lib/shaper
      --init-sql "ATTACH '/data/dbt_analytics.duckdb' AS dbt_analytics (READ_ONLY);"
    mem_limit: 1g             # Límite generoso; en reposo consumirá mucho menos
    restart: unless-stopped
    logging: *logging

  # --- TRABAJOS PUNTUALES (solo gastan RAM mientras corren) ---

  pipeline:                     # dlt + dbt
    profiles: ["job"]
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: pipeline_runner_nyc
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MES: "${MES}"
      DBT_PROFILES_DIR: /app/dbt
      # dlt: un solo worker y buffers chicos = menos RAM
      EXTRACT__WORKERS: "1"
      NORMALIZE__WORKERS: "1"
      LOAD__WORKERS: "1"
      DATA_WRITER__BUFFER_MAX_ITEMS: "5000"
      DATA_WRITER__FILE_MAX_ITEMS: "100000"

    mem_limit: 4g
    restart: "no"
    logging: *logging

volumes:
  shaper_state:
